<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Translator</h1>
            <p class="subtitle">Local ES ↔ EN translation & text improvement</p>
            <div class="model-selector">
                <label for="modelSelect">Model:</label>
                <select id="modelSelect" class="model-select">
                    <option value="8bit">8-bit (higher quality)</option>
                    <option value="4bit">4-bit (faster)</option>
                </select>
            </div>
        </header>

        <div class="tab-bar">
            <button id="translateTab" class="tab active">Translate</button>
            <button id="improveTab" class="tab">Improve</button>
        </div>

        <div class="translator">
            <div class="panel input-panel">
                <div class="panel-header">
                    <select id="sourceLang" class="lang-selector">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <textarea
                    id="sourceText"
                    class="text-area"
                    placeholder="Type or paste text here..."
                    autofocus
                ></textarea>
                <div class="panel-footer">
                    <span id="charCount" class="char-count">0 characters</span>
                </div>
            </div>

            <div id="swapBtnContainer" class="swap-button-container">
                <button id="swapBtn" class="swap-button" title="Intercambiar idiomas">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
                    </svg>
                </button>
            </div>

            <div class="panel output-panel">
                <div class="panel-header" id="outputHeader">
                    <select id="targetLang" class="lang-selector">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                    </select>
                    <div class="temperature-control">
                        <label for="temperatureSlider" title="Synonyms creativity: low=conservative, high=creative">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="12" y1="18" x2="12" y2="12"/>
                                <line x1="9" y1="15" x2="15" y2="15"/>
                            </svg>
                        </label>
                        <input type="range" id="temperatureSlider" min="0" max="1" step="0.1" value="0.3">
                        <span id="temperatureValue">0.3</span>
                    </div>
                </div>
                <textarea
                    id="targetText"
                    class="text-area"
                    placeholder="Translation will appear here..."
                    readonly
                ></textarea>
                <div class="panel-footer">
                    <button id="copyBtn" class="copy-button" title="Copy to clipboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span class="copy-text">Copy</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

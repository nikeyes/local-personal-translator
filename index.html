<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Translator</h1>
            <p class="subtitle">Local ES ↔ EN translation</p>
        </header>

        <div class="translator">
            <div class="panel input-panel">
                <div class="panel-header">
                    <select id="sourceLang" class="lang-selector">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <textarea
                    id="sourceText"
                    class="text-area"
                    placeholder="Escribe o pega el texto aquí..."
                    autofocus
                ></textarea>
                <div class="panel-footer">
                    <span id="charCount" class="char-count">0 caracteres</span>
                </div>
            </div>

            <div class="swap-button-container">
                <button id="swapBtn" class="swap-button" title="Intercambiar idiomas">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
                    </svg>
                </button>
            </div>

            <div class="panel output-panel">
                <div class="panel-header">
                    <select id="targetLang" class="lang-selector">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                    </select>
                </div>
                <textarea
                    id="targetText"
                    class="text-area"
                    placeholder="La traducción aparecerá aquí..."
                    readonly
                ></textarea>
                <div class="panel-footer">
                    <button id="copyBtn" class="copy-button" title="Copiar al portapapeles">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span class="copy-text">Copiar</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
